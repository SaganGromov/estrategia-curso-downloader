name: Testes

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  testes:
    runs-on: windows-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v7

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12.10"
          cache: pip
          cache-dependency-path: requirements.lock.txt

      - name: Instalar dependências
        run: python -m pip install -r requirements.lock.txt

      - name: Validar bootstrap
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\bootstrap.ps1 --validate-bootstrap

      - name: Validar sintaxe
        run: python -m py_compile estrategia_download_edge_any.py interface_web.py

      - name: Executar testes
        run: python -m unittest discover -s tests -v
